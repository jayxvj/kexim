<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kexim - Products Mgm</title>
  <link rel="icon" type="image/png" href="https://i.ibb.co/5W75P2GJ/kexim-logo-removebg-preview.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --ink: #1f2937;
      --soft: #64748b;
      --line: #dbe3ee;
      --accent: #166534;
      --bg: #f8fafc;
    }

    body {
      background: radial-gradient(circle at 0% 0%, #e2f7df, transparent 34%), radial-gradient(circle at 100% 10%, #dcfce7, transparent 32%), var(--bg);
      color: var(--ink);
    }

    .panel {
      border: 1px solid var(--line);
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    input,
    textarea,
    select {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      width: 100%;
    }
  </style>
</head>

<body class="min-h-screen">
  <main class="mx-auto max-w-6xl p-4 sm:p-6 lg:p-10">
    <section id="loginView" class="mx-auto mt-20 max-w-md panel p-6">
      <h1 class="text-2xl font-bold text-green-800">Admin Login</h1>
      <p class="mt-2 text-sm text-slate-600">Use hardcoded credentials to manage products and filters.</p>
      <form id="loginForm" class="mt-6 space-y-4">
        <div>
          <label class="mb-1 block text-sm font-semibold">Username</label>
          <input id="username" type="text" required autocomplete="username" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-semibold">Password</label>
          <input id="password" type="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="w-full rounded-xl bg-green-700 px-4 py-2 font-semibold text-white hover:bg-green-800">Login</button>
      </form>
      <p id="loginError" class="mt-3 hidden text-sm font-semibold text-red-600"></p>
    </section>

    <section id="adminView" class="hidden space-y-6">
      <header class="panel p-5 sm:p-6">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold text-green-800">Products Admin</h1>
            <p class="mt-1 text-sm text-slate-600">Add, edit, update, and remove product cards and filter buttons.</p>
          </div>
          <div class="flex gap-2">
            <a href="/" class="rounded-xl border border-slate-300 px-4 py-2 text-sm font-semibold hover:bg-slate-50">Back To Site</a>
            <button id="logoutBtn" type="button" class="rounded-xl bg-slate-800 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-900">Logout</button>
          </div>
        </div>
      </header>

      <section class="panel p-5 sm:p-6">
        <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
          <h2 class="text-xl font-bold text-green-800">Filter Buttons</h2>
          <button id="addFilterBtn" type="button" class="rounded-xl bg-green-700 px-3 py-2 text-sm font-semibold text-white hover:bg-green-800">Add Filter</button>
        </div>
        <div id="filtersList" class="space-y-3"></div>
      </section>

      <section class="panel p-5 sm:p-6">
        <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
          <h2 class="text-xl font-bold text-green-800">Product Cards</h2>
          <button id="addProductBtn" type="button" class="rounded-xl bg-green-700 px-3 py-2 text-sm font-semibold text-white hover:bg-green-800">Add Product</button>
        </div>
        <div id="productsList" class="space-y-4"></div>
      </section>

      <section class="sticky bottom-3 z-20 panel p-5 sm:p-6">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div class="flex flex-wrap items-center gap-3">
            <button id="saveBtn" type="button" class="rounded-xl bg-green-700 px-4 py-2 font-semibold text-white hover:bg-green-800">Save Changes</button>
            <button id="resetBtn" type="button" class="rounded-xl border border-slate-300 px-4 py-2 font-semibold hover:bg-slate-50">Reset To Default</button>
          </div>
          <span id="statusText" class="text-sm font-semibold text-green-700"></span>
        </div>
      </section>
    </section>
  </main>

  <script>
    const CATALOG_STORAGE_KEY = 'keximCatalogV1';
    const CATALOG_API_URL = '/api/catalog';
    const CATALOG_SYNC_KEY = 'keximCatalogSyncTs';
    const SESSION_KEY = 'keximAdminSession';

    const loginView = document.getElementById('loginView');
    const adminView = document.getElementById('adminView');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const logoutBtn = document.getElementById('logoutBtn');
    const addFilterBtn = document.getElementById('addFilterBtn');
    const addProductBtn = document.getElementById('addProductBtn');
    const saveBtn = document.getElementById('saveBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusText = document.getElementById('statusText');
    const filtersList = document.getElementById('filtersList');
    const productsList = document.getElementById('productsList');

    let defaultCatalog = { filters: [{ id: 'all', label: 'All' }], products: [] };
    let catalog = { filters: [{ id: 'all', label: 'All' }], products: [] };

    const slugify = (value) => String(value || '')
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');

    const uid = () => `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

    const setStatus = (text, isError = false) => {
      statusText.textContent = text;
      statusText.className = `text-sm font-semibold ${isError ? 'text-red-700' : 'text-green-700'}`;
      if (!text) return;
      setTimeout(() => {
        if (statusText.textContent === text) statusText.textContent = '';
      }, 2600);
    };

    const deepClone = (obj) => JSON.parse(JSON.stringify(obj));

    const safeParse = (value) => {
      try {
        const parsed = JSON.parse(value);
        if (!parsed || !Array.isArray(parsed.filters) || !Array.isArray(parsed.products)) return null;
        return parsed;
      } catch {
        return null;
      }
    };

    const fetchRemoteCatalog = async () => {
      try {
        const response = await fetch(CATALOG_API_URL, { cache: 'no-store' });
        if (!response.ok) return null;
        const data = await response.json();
        if (!data?.catalog || !Array.isArray(data.catalog.filters) || !Array.isArray(data.catalog.products)) return null;
        return data.catalog;
      } catch {
        return null;
      }
    };

    const saveRemoteCatalog = async (next) => {
      try {
        const response = await fetch(CATALOG_API_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ catalog: next })
        });
        return response.ok;
      } catch {
        return false;
      }
    };

    const normalizeCatalog = (raw) => {
      const filtersInput = Array.isArray(raw.filters) ? raw.filters : [];
      const filters = [{ id: 'all', label: 'All' }];
      const seen = new Set(['all']);

      filtersInput.forEach((f) => {
        const id = slugify(f.id || f.label);
        const label = String(f.label || '').trim();
        if (!id || id === 'all' || !label || seen.has(id)) return;
        seen.add(id);
        filters.push({ id, label });
      });

      const valid = new Set(filters.map((f) => f.id));
      const fallbackCategory = filters[1]?.id || 'all';
      const productsInput = Array.isArray(raw.products) ? raw.products : [];
      const products = productsInput.map((p, idx) => {
        const category = slugify(p.category);
        return {
          id: p.id || `p-${idx + 1}`,
          title: String(p.title || `Product ${idx + 1}`),
          tag: String(p.tag || ''),
          description: String(p.description || ''),
          category: valid.has(category) ? category : fallbackCategory,
          imageUrl: String(p.imageUrl || '')
        };
      });

      return { filters, products };
    };

    const parseDefaultFromHtml = (htmlText) => {
      const doc = new DOMParser().parseFromString(htmlText, 'text/html');
      const filterNodes = Array.from(doc.querySelectorAll('#productFilters .filter-btn'));
      const productNodes = Array.from(doc.querySelectorAll('#productsGrid .product-card'));

      const filters = [{ id: 'all', label: 'All' }];
      const filterSeen = new Set(['all']);
      filterNodes.forEach((btn) => {
        const id = slugify(btn.getAttribute('data-filter'));
        const label = btn.textContent.trim();
        if (!id || id === 'all' || !label || filterSeen.has(id)) return;
        filterSeen.add(id);
        filters.push({ id, label });
      });

      const products = productNodes.map((card, idx) => {
        const style = card.querySelector('.h-44')?.getAttribute('style') || '';
        const imageUrl = (style.match(/url\(['"]?(.*?)['"]?\)/i) || [])[1] || '';
        return {
          id: `p-${idx + 1}`,
          title: card.querySelector('h3')?.textContent?.trim() || `Product ${idx + 1}`,
          tag: card.querySelector('span')?.textContent?.trim() || '',
          description: card.querySelector('p')?.textContent?.trim() || '',
          category: slugify(card.getAttribute('data-category')) || filters[1]?.id || 'all',
          imageUrl
        };
      });

      return normalizeCatalog({ filters, products });
    };

    const fetchDefaultCatalog = async () => {
      const candidates = ['/index.html', '/', 'index.html'];
      for (const path of candidates) {
        try {
          const response = await fetch(path, { cache: 'no-store' });
          if (!response.ok) continue;
          const html = await response.text();
          const parsed = parseDefaultFromHtml(html);
          if (parsed.products.length || parsed.filters.length > 1) return parsed;
        } catch {
          // Try next path candidate.
        }
      }
      return { filters: [{ id: 'all', label: 'All' }], products: [] };
    };

    const collectFiltersFromUi = () => {
      const rows = Array.from(filtersList.querySelectorAll('[data-filter-row="1"]'));
      const filters = [{ id: 'all', label: 'All' }];
      const seen = new Set(['all']);
      rows.forEach((row) => {
        const idInput = row.querySelector('[data-key="id"]');
        const labelInput = row.querySelector('[data-key="label"]');
        const label = labelInput.value.trim();
        const id = slugify(idInput.value || label);
        if (!idInput.value.trim() && id) idInput.value = id;
        if (!id || !label || id === 'all' || seen.has(id)) return;
        seen.add(id);
        filters.push({ id, label });
      });
      return filters;
    };

    const collectProductsFromUi = (filters) => {
      const rows = Array.from(productsList.querySelectorAll('[data-product-row="1"]'));
      const allowed = new Set(filters.map((f) => f.id));
      const fallbackCategory = filters[1]?.id || 'all';
      return rows.map((row, idx) => {
        const currentCategory = slugify(row.querySelector('[data-key="category"]').value);
        return {
          id: row.dataset.id || `p-${idx + 1}`,
          title: row.querySelector('[data-key="title"]').value.trim() || `Product ${idx + 1}`,
          tag: row.querySelector('[data-key="tag"]').value.trim(),
          description: row.querySelector('[data-key="description"]').value.trim(),
          imageUrl: row.querySelector('[data-key="imageUrl"]').value.trim(),
          category: allowed.has(currentCategory) ? currentCategory : fallbackCategory
        };
      });
    };

    const renderFilters = () => {
      const editableFilters = catalog.filters.filter((f) => f.id !== 'all');
      filtersList.innerHTML = '';

      if (!editableFilters.length) {
        const empty = document.createElement('p');
        empty.className = 'text-sm text-slate-500';
        empty.textContent = 'No custom filters yet. Add one.';
        filtersList.appendChild(empty);
        return;
      }

      editableFilters.forEach((filter) => {
        const row = document.createElement('div');
        row.className = 'grid gap-2 rounded-xl border border-slate-200 p-3 sm:grid-cols-[1fr_2fr_auto]';
        row.dataset.filterRow = '1';
        row.innerHTML = `
          <input data-key="id" type="text" value="${filter.id}" placeholder="filter-id" />
          <input data-key="label" type="text" value="${filter.label}" placeholder="Filter Label" />
          <button type="button" class="rounded-lg bg-red-600 px-3 py-2 text-sm font-semibold text-white hover:bg-red-700">Delete</button>
        `;
        row.querySelector('button').addEventListener('click', () => {
          row.remove();
          setStatus('Filter removed from draft.');
          syncCategoryOptions();
        });
        const idInput = row.querySelector('[data-key="id"]');
        const labelInput = row.querySelector('[data-key="label"]');
        idInput.addEventListener('change', () => {
          idInput.value = slugify(idInput.value);
          syncCategoryOptions();
        });
        labelInput.addEventListener('blur', () => {
          if (!idInput.value.trim()) idInput.value = slugify(labelInput.value);
          syncCategoryOptions();
        });
        filtersList.appendChild(row);
      });
    };

    const renderProducts = () => {
      productsList.innerHTML = '';
      if (!catalog.products.length) {
        const empty = document.createElement('p');
        empty.className = 'text-sm text-slate-500';
        empty.textContent = 'No product cards yet. Add one.';
        productsList.appendChild(empty);
        return;
      }

      catalog.products.forEach((product) => {
        const row = document.createElement('div');
        row.className = 'grid gap-2 rounded-xl border border-slate-200 p-3 sm:grid-cols-2';
        row.dataset.productRow = '1';
        row.dataset.id = product.id || uid();
        row.innerHTML = `
          <div><label class="mb-1 block text-xs font-semibold text-slate-600">Title</label><input data-key="title" value="${product.title || ''}" /></div>
          <div><label class="mb-1 block text-xs font-semibold text-slate-600">Filter ID</label><select data-key="category"></select></div>
          <div><label class="mb-1 block text-xs font-semibold text-slate-600">Badge</label><input data-key="tag" value="${product.tag || ''}" /></div>
          <div><label class="mb-1 block text-xs font-semibold text-slate-600">Image URL</label><input data-key="imageUrl" value="${product.imageUrl || ''}" /></div>
          <div class="sm:col-span-2"><label class="mb-1 block text-xs font-semibold text-slate-600">Description</label><textarea data-key="description" rows="2">${product.description || ''}</textarea></div>
          <div class="sm:col-span-2 text-right"><button type="button" class="rounded-lg bg-red-600 px-3 py-2 text-sm font-semibold text-white hover:bg-red-700">Delete Product</button></div>
        `;
        row.querySelector('button').addEventListener('click', () => {
          row.remove();
          setStatus('Product removed from draft.');
        });
        productsList.appendChild(row);
      });

      syncCategoryOptions();
    };

    const syncCategoryOptions = () => {
      const filters = collectFiltersFromUi();
      const customFilters = filters.filter((f) => f.id !== 'all');
      const fallback = customFilters[0]?.id || 'all';
      const selects = Array.from(productsList.querySelectorAll('select[data-key="category"]'));
      selects.forEach((select) => {
        const current = slugify(select.value);
        const options = customFilters.length ? customFilters : [{ id: 'all', label: 'All' }];
        select.innerHTML = options.map((f) => `<option value="${f.id}">${f.id} - ${f.label}</option>`).join('');
        const next = options.some((f) => f.id === current) ? current : fallback;
        select.value = next;
      });
    };

    const renderAll = () => {
      renderFilters();
      renderProducts();
    };

    const enterAdmin = () => {
      loginView.classList.add('hidden');
      adminView.classList.remove('hidden');
    };

    const enterLogin = () => {
      adminView.classList.add('hidden');
      loginView.classList.remove('hidden');
    };

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/admin-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (!response.ok) {
          loginError.textContent = 'Invalid username or password.';
          loginError.classList.remove('hidden');
          return;
        }

        sessionStorage.setItem(SESSION_KEY, '1');
        loginError.classList.add('hidden');
        enterAdmin();
      } catch {
        loginError.textContent = 'Login service unavailable.';
        loginError.classList.remove('hidden');
      }
    });

    logoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem(SESSION_KEY);
      enterLogin();
    });

    addFilterBtn.addEventListener('click', () => {
      const row = document.createElement('div');
      row.className = 'grid gap-2 rounded-xl border border-slate-200 p-3 sm:grid-cols-[1fr_2fr_auto]';
      row.dataset.filterRow = '1';
      row.innerHTML = `
        <input data-key="id" type="text" placeholder="new-filter-id" />
        <input data-key="label" type="text" placeholder="New Filter Label" />
        <button type="button" class="rounded-lg bg-red-600 px-3 py-2 text-sm font-semibold text-white hover:bg-red-700">Delete</button>
      `;
      row.querySelector('button').addEventListener('click', () => {
        row.remove();
        syncCategoryOptions();
      });
      row.querySelector('[data-key="id"]').addEventListener('change', (e) => {
        e.target.value = slugify(e.target.value);
        syncCategoryOptions();
      });
      row.querySelector('[data-key="label"]').addEventListener('blur', (e) => {
        const idInput = row.querySelector('[data-key="id"]');
        if (!idInput.value.trim()) idInput.value = slugify(e.target.value);
        syncCategoryOptions();
      });
      const empty = filtersList.querySelector('p');
      if (empty) empty.remove();
      filtersList.appendChild(row);
      setStatus('Filter added to draft.');
      syncCategoryOptions();
    });

    addProductBtn.addEventListener('click', () => {
      const row = document.createElement('div');
      row.className = 'grid gap-2 rounded-xl border border-slate-200 p-3 sm:grid-cols-2';
      row.dataset.productRow = '1';
      row.dataset.id = uid();
      row.innerHTML = `
        <div><label class="mb-1 block text-xs font-semibold text-slate-600">Title</label><input data-key="title" placeholder="Product title" /></div>
        <div><label class="mb-1 block text-xs font-semibold text-slate-600">Filter ID</label><select data-key="category"></select></div>
        <div><label class="mb-1 block text-xs font-semibold text-slate-600">Badge</label><input data-key="tag" placeholder="Category tag" /></div>
        <div><label class="mb-1 block text-xs font-semibold text-slate-600">Image URL</label><input data-key="imageUrl" placeholder="https://..." /></div>
        <div class="sm:col-span-2"><label class="mb-1 block text-xs font-semibold text-slate-600">Description</label><textarea data-key="description" rows="2" placeholder="Short description"></textarea></div>
        <div class="sm:col-span-2 text-right"><button type="button" class="rounded-lg bg-red-600 px-3 py-2 text-sm font-semibold text-white hover:bg-red-700">Delete Product</button></div>
      `;
      row.querySelector('button').addEventListener('click', () => row.remove());
      const empty = productsList.querySelector('p');
      if (empty) empty.remove();
      productsList.appendChild(row);
      syncCategoryOptions();
      setStatus('Product added to draft.');
    });

    const saveDraft = async () => {
      const filters = collectFiltersFromUi();
      const products = collectProductsFromUi(filters);
      const next = normalizeCatalog({ filters, products });
      catalog = next;
      localStorage.setItem(CATALOG_STORAGE_KEY, JSON.stringify(next));
      localStorage.setItem(CATALOG_SYNC_KEY, String(Date.now()));
      const remoteSaved = await saveRemoteCatalog(next);
      if (remoteSaved) {
        setStatus('Changes saved.');
      } else {
        setStatus('Saved locally. Configure KV to sync across browsers.', true);
      }
    };

    saveBtn.addEventListener('click', saveDraft);

    resetBtn.addEventListener('click', async () => {
      localStorage.setItem(CATALOG_STORAGE_KEY, JSON.stringify(defaultCatalog));
      localStorage.setItem(CATALOG_SYNC_KEY, String(Date.now()));
      catalog = deepClone(defaultCatalog);
      renderAll();
      const remoteSaved = await saveRemoteCatalog(defaultCatalog);
      if (remoteSaved) {
        setStatus('Reset to default products and filters.');
      } else {
        setStatus('Reset locally. Configure KV to sync across browsers.', true);
      }
    });

    const init = async () => {
      defaultCatalog = await fetchDefaultCatalog();
      const remote = await fetchRemoteCatalog();
      const stored = safeParse(localStorage.getItem(CATALOG_STORAGE_KEY));
      catalog = normalizeCatalog(remote || stored || defaultCatalog);
      localStorage.setItem(CATALOG_STORAGE_KEY, JSON.stringify(catalog));
      renderAll();

      if (sessionStorage.getItem(SESSION_KEY) === '1') {
        enterAdmin();
      } else {
        enterLogin();
      }
    };

    init();
  </script>
</body>

</html>
